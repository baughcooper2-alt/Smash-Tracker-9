<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smash Remote</title>
<meta name="theme-color" content="#ffd400">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Smash Remote">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root { --ink:#17140f; --paper:#fffdf7; --bg:#f4ecd8; --yellow:#ffd400; --red:#e8402a; --green:#2ea86a; --blue:#1f6fd0; --dim:#efe5cd; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { background:var(--bg); color:var(--ink); }
  body {
    min-height:100vh; min-height:100dvh;
    font-family:Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight:700;
    background-image:repeating-linear-gradient(115deg, rgba(232,64,42,.055) 0 22px, transparent 22px 64px);
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    touch-action:manipulation; -webkit-user-select:none; user-select:none;
  }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; touch-action:manipulation; }
  input { font:inherit; }
  .blk { font-family:'Archivo Black', Archivo, sans-serif; font-weight:900; }
  .lbl { font-size:10px; font-weight:800; letter-spacing:.18em; opacity:.55; }

  header {
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:var(--yellow); background-image:repeating-linear-gradient(115deg, rgba(23,20,15,.07) 0 10px, transparent 10px 30px);
    border-bottom:4px solid var(--ink); box-shadow:0 4px 0 rgba(232,64,42,.85);
  }
  .logo { flex:none; width:32px; height:32px; background:var(--red); border:3px solid var(--ink); border-radius:8px; box-shadow:2px 2px 0 var(--ink);
    display:flex; align-items:center; justify-content:center; color:var(--paper); font-size:16px; }
  .title { font-size:17px; letter-spacing:-.01em; line-height:1; }
  .pill { display:flex; align-items:center; gap:6px; padding:5px 9px; background:var(--paper); border:2.5px solid var(--ink); border-radius:20px;
    font-size:9.5px; font-weight:800; letter-spacing:.12em; white-space:nowrap; }
  .dot { width:8px; height:8px; border-radius:50%; background:#8a8272; }
  .dot.live { background:var(--green); animation:blip 2.2s ease-in-out infinite; }
  .dot.wait { background:var(--yellow); border:1.5px solid var(--ink); animation:blip 1s ease-in-out infinite; }
  .dot.bad { background:var(--red); }
  .today { margin-left:auto; text-align:right; line-height:1; }
  .today .rec { font-size:20px; }
  @keyframes blip { 0%,100%{opacity:1} 50%{opacity:.35} }
  @keyframes rise { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
  @keyframes pop { 0%{transform:translateX(-50%) scale(.85);opacity:0} 100%{transform:translateX(-50%) scale(1);opacity:1} }

  main { max-width:560px; margin:0 auto; padding:14px 14px 0; display:flex; flex-direction:column; gap:14px; }
  .card { background:var(--paper); border:3.5px solid var(--ink); border-radius:14px; box-shadow:5px 5px 0 var(--ink); padding:12px; }
  .banner { padding:10px 12px; border:3px solid var(--ink); border-radius:12px; font-size:12.5px; line-height:1.4; display:flex; gap:10px; align-items:center; }
  .banner.wait { background:var(--paper); }
  .banner.bad { background:var(--red); color:var(--paper); }
  .banner button { margin-left:auto; flex:none; padding:7px 10px; border:2.5px solid var(--ink); border-radius:8px; background:var(--paper); color:var(--ink); font-size:11px; }
  .off { opacity:.45; pointer-events:none; }

  .seg { display:flex; background:var(--ink); border:3px solid var(--ink); border-radius:12px; padding:3px; gap:3px; }
  .seg button { flex:1; padding:11px 0; border-radius:9px; color:var(--paper); font-size:15px; letter-spacing:.06em; }
  .seg button.on { background:var(--red); box-shadow:inset 0 -3px 0 rgba(23,20,15,.3); }

  .sides { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:stretch; }
  .side { display:flex; flex-direction:column; gap:8px; min-width:0; }
  .side .lbl { opacity:.7; }
  .vs { align-self:center; font-size:15px; color:var(--red); }
  .fbtn { display:flex; align-items:center; gap:9px; width:100%; min-width:0; padding:9px; background:var(--paper); border:3px solid var(--ink); border-radius:12px;
    box-shadow:3px 3px 0 var(--ink); text-align:left; min-height:64px; }
  .fbtn:active { transform:translate(3px,3px); box-shadow:none; }
  .fbtn .nm { display:flex; flex-direction:column; gap:3px; min-width:0; }
  .fbtn .nm b { font-family:'Archivo Black', Archivo, sans-serif; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fbtn .nm i { font-style:normal; font-size:9px; font-weight:800; letter-spacing:.14em; opacity:.55; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip { flex:none; border-radius:9px; border:2.5px solid var(--ink); display:flex; align-items:center; justify-content:center;
    font-family:'Archivo Black', Archivo, sans-serif; color:var(--paper); text-shadow:0 1px 0 rgba(23,20,15,.45);
    background-size:contain; background-repeat:no-repeat; background-position:center; overflow:hidden; }

  .ko { display:flex; align-items:center; gap:10px; }
  .ko + .ko { margin-top:10px; padding-top:10px; border-top:2px dashed rgba(23,20,15,.15); }
  .ko .who { flex:1; font-size:11px; font-weight:800; letter-spacing:.14em; }
  .ko .n { min-width:44px; text-align:center; font-size:30px; line-height:1; }
  .ko button { width:56px; height:52px; border:3px solid var(--ink); border-radius:12px; background:var(--paper); box-shadow:3px 3px 0 var(--ink); font-size:24px; line-height:1; }
  .ko button.plus { background:var(--yellow); }
  .ko button:active { transform:translate(3px,3px); box-shadow:none; }

  .wl { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .big { height:124px; border:4px solid var(--ink); border-radius:16px; box-shadow:6px 6px 0 var(--ink); color:var(--paper);
    background-image:repeating-linear-gradient(115deg, rgba(255,253,247,.12) 0 10px, transparent 10px 26px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .big:active { transform:translate(5px,5px); box-shadow:1px 1px 0 var(--ink); }
  .big b { font-family:'Archivo Black', Archivo, sans-serif; font-size:34px; letter-spacing:.04em; line-height:1; }
  .big i { font-style:normal; font-size:10px; font-weight:800; letter-spacing:.16em; opacity:.85; }
  .big.win { background-color:var(--green); }
  .big.loss { background-color:var(--red); }

  .games { display:flex; flex-direction:column; gap:7px; margin-top:9px; }
  .g { display:flex; align-items:center; gap:9px; padding:8px 9px; border:2.5px solid var(--ink); border-radius:10px; }
  .g.W { background:rgba(46,168,106,.13); } .g.L { background:rgba(232,64,42,.11); }
  .g .b { flex:none; width:26px; height:26px; border-radius:7px; border:2.5px solid var(--ink); color:var(--paper); display:flex; align-items:center; justify-content:center; font-size:12px; }
  .g.W .b { background:var(--green); } .g.L .b { background:var(--red); }
  .g .t { display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; }
  .g .t span:first-child { font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .g .t span:last-child { font-size:9.5px; font-weight:800; letter-spacing:.1em; opacity:.55; }
  .g .undo { flex:none; padding:6px 9px; border:2.5px solid var(--ink); border-radius:8px; background:var(--paper); font-size:10.5px; letter-spacing:.06em; }
  .g .undo.arm { background:var(--red); color:var(--paper); }
  .empty { font-size:12px; opacity:.55; margin-top:6px; }
  .rowhead { display:flex; align-items:center; gap:8px; }
  .rowhead .blk { font-size:13px; letter-spacing:.06em; }
  .rowhead .aside { margin-left:auto; font-size:10px; font-weight:800; letter-spacing:.12em; opacity:.6; }

  details.set summary { list-style:none; display:flex; align-items:center; gap:8px; cursor:pointer; }
  details.set summary::-webkit-details-marker { display:none; }
  details.set summary::after { content:'▾'; margin-left:auto; font-size:14px; }
  details.set[open] summary::after { content:'▴'; }
  .opts { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
  .pills { display:flex; flex-wrap:wrap; gap:6px; margin-top:5px; }
  .pills button { padding:9px 12px; border:2.5px solid var(--ink); border-radius:9px; background:var(--paper); box-shadow:2px 2px 0 var(--ink);
    font-family:'Archivo Black', Archivo, sans-serif; font-size:11.5px; letter-spacing:.06em; }
  .pills button.on { background:var(--blue); color:var(--paper); box-shadow:inset 0 -3px 0 rgba(23,20,15,.28); }

  .foot { display:flex; justify-content:center; gap:8px; align-items:center; font-size:11px; font-weight:800; letter-spacing:.1em; opacity:.6; padding:4px 0 8px; }
  .foot button { text-decoration:underline; font-weight:800; letter-spacing:.1em; }

  /* pair screen */
  .pair { display:flex; flex-direction:column; gap:12px; }
  .pair h1 { font-size:22px; line-height:1.1; }
  .pair p { font-size:13px; line-height:1.45; opacity:.75; font-weight:600; }
  .pair input { width:100%; padding:14px; text-align:center; font-family:'Archivo Black', Archivo, sans-serif; font-size:34px; letter-spacing:.3em; text-transform:uppercase;
    background:#f7efdb; border:3.5px solid var(--ink); border-radius:12px; color:var(--ink); -webkit-user-select:text; user-select:text; }
  .go { padding:15px; background:var(--ink); color:var(--paper); border:3px solid var(--ink); border-radius:12px; box-shadow:4px 4px 0 rgba(232,64,42,.9); font-size:15px; letter-spacing:.08em; }

  /* stock sheet */
  .scrim { position:fixed; inset:0; z-index:40; background:rgba(23,20,15,.55); display:flex; align-items:flex-end; justify-content:center; }
  .sheet { width:100%; max-width:560px; background:var(--paper); border:4px solid var(--ink); border-bottom:0; border-radius:18px 18px 0 0;
    padding:16px 14px calc(16px + env(safe-area-inset-bottom)); animation:rise .16s ease; display:flex; flex-direction:column; gap:12px; }
  .sheet .q { font-size:16px; line-height:1.2; }
  .sheet .sub { font-size:10px; font-weight:800; letter-spacing:.14em; opacity:.55; }
  .stk { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .stk button { height:74px; border:3.5px solid var(--ink); border-radius:14px; box-shadow:4px 4px 0 var(--ink); background:var(--paper);
    font-family:'Archivo Black', Archivo, sans-serif; font-size:30px; line-height:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .stk button i { font-style:normal; font-family:Archivo, sans-serif; font-size:9.5px; font-weight:800; letter-spacing:.14em; opacity:.6; }
  .stk button:active { transform:translate(4px,4px); box-shadow:none; }
  .sheet.W .stk button { background:#dff3e8; } .sheet.L .stk button { background:#fbe1dc; }
  .sheet .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .sheet .row2 button { padding:13px; border:3px solid var(--ink); border-radius:12px; font-size:13px; letter-spacing:.08em; background:var(--paper); }
  .sheet .row2 button.dark { background:var(--ink); color:var(--paper); }
  .sheet .kos { display:flex; flex-wrap:wrap; gap:6px; font-size:11px; font-weight:800; letter-spacing:.1em; }
  .sheet .kos span { padding:5px 9px; border:2px solid var(--ink); border-radius:20px; background:#f7efdb; }

  /* picker */
  .picker { position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; flex-direction:column; animation:rise .14s ease; }
  .picker .ph { display:flex; align-items:center; gap:10px; padding:calc(12px + env(safe-area-inset-top)) 14px 10px; background:var(--yellow); border-bottom:4px solid var(--ink); }
  .picker .ph .blk { font-size:16px; flex:1; }
  .picker .x { width:42px; height:42px; border:3px solid var(--ink); border-radius:10px; background:var(--paper); font-size:18px; }
  .picker .srch { padding:10px 14px 0; }
  .picker .srch input { width:100%; padding:12px; background:var(--paper); border:3px solid var(--ink); border-radius:11px; font-size:16px; font-weight:700; color:var(--ink); -webkit-user-select:text; user-select:text; }
  .picker .body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px 14px calc(24px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px; }
  .recent { display:flex; gap:7px; overflow-x:auto; padding:2px 2px 6px; margin-top:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(78px, 1fr)); gap:8px; margin-top:6px; }
  .tile { display:flex; flex-direction:column; align-items:center; gap:6px; padding:9px 4px 8px; background:var(--paper); border:3px solid var(--ink); border-radius:12px; box-shadow:3px 3px 0 var(--ink); min-width:0; }
  .tile.on { background:var(--yellow); box-shadow:inset 0 -4px 0 rgba(23,20,15,.2); }
  .tile b { font-family:'Archivo Black', Archivo, sans-serif; font-size:10.5px; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 2px; }
  .recent .tile { flex:none; width:78px; }

  .toast { position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); z-index:60; transform:translateX(-50%); padding:12px 20px;
    background:var(--ink); color:var(--yellow); border:3px solid var(--yellow); border-radius:8px; box-shadow:5px 5px 0 rgba(232,64,42,.9);
    font-family:'Archivo Black', Archivo, sans-serif; font-size:13px; letter-spacing:.1em; white-space:nowrap; animation:pop .18s ease; pointer-events:none; }
  .hide { display:none !important; }
</style>
</head>
<body>
<header>
  <div class="logo blk">S</div>
  <div>
    <div class="title blk">SMASH REMOTE</div>
    <div class="pill" id="status" style="margin-top:4px"><span class="dot"></span><span>—</span></div>
  </div>
  <div class="today hide" id="today"><div class="lbl" style="opacity:.6">TODAY</div><div class="rec blk">0–0</div></div>
</header>
<main id="main"></main>
<div id="sheet"></div>
<div id="picker" class="picker hide">
  <div class="ph"><div class="blk" id="pickerTitle">PICK A FIGHTER</div><button class="x blk" data-act="closePicker" aria-label="Close">✕</button></div>
  <div class="srch"><input id="search" type="search" placeholder="Search fighters" autocomplete="off" autocorrect="off" spellcheck="false"></div>
  <div class="body" id="pickerBody"></div>
</div>
<div id="toast"></div>

<script src="vendor/peerjs.min.js"></script>
<script>
(function(){
  'use strict';
  var PREFIX = 'smashtracker9-';
  var STORE = 'smashremote.v1';
  var CODE_RE = /^[A-Z0-9]{5}$/;

  // ---------- state ----------
  var S = {
    code:'', status:'idle', statusMsg:'',
    host:null, fighters:[], byId:{}, images:{}, rv:'',
    pending:null, picker:null, search:'', outbox:[], edits:{}, undoArm:null
  };

  function load(){
    try {
      var c = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (c && typeof c === 'object'){
        S.code = typeof c.code === 'string' ? c.code : '';
        S.fighters = Array.isArray(c.fighters) ? c.fighters : [];
        S.images = c.images && typeof c.images === 'object' ? c.images : {};
        S.rv = typeof c.rv === 'string' ? c.rv : '';
        S.outbox = Array.isArray(c.outbox) ? c.outbox : [];
        S.host = c.host && typeof c.host === 'object' ? c.host : null;
      }
    } catch(e){}
    indexFighters();
  }
  function save(){
    var base = {code:S.code, fighters:S.fighters, rv:S.rv, outbox:S.outbox, host:S.host};
    try { localStorage.setItem(STORE, JSON.stringify(Object.assign({images:S.images}, base))); }
    catch(e){ try { localStorage.setItem(STORE, JSON.stringify(Object.assign({images:{}}, base, {rv:''}))); } catch(e2){} }
  }
  function peerOpts(){
    try { var o = JSON.parse(localStorage.getItem('smash.peerOpts') || 'null'); if (o && typeof o === 'object') return o; } catch(e){}
    return {debug:0};
  }
  function indexFighters(){ S.byId = {}; S.fighters.forEach(function(f){ S.byId[f.id] = f; }); }

  // ---------- helpers ----------
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function nameOf(id){ var f = S.byId[id]; return f ? f.name : '—'; }
  function colorOf(id){ var f = S.byId[id]; var c = f && f.color; return /^#[0-9a-f]{3,8}$/i.test(c || '') ? c : '#17140f'; }
  function chip(id, size){
    var img = S.images[id];
    var ok = typeof img === 'string' && /^data:image\/[a-z+]+;base64,[A-Za-z0-9+/=]+$/.test(img);
    var st = 'width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*.42)+'px;background-color:'+colorOf(id)+';' +
      (ok ? 'background-image:url('+img+');color:transparent;' : '');
    return '<span class="chip" style="'+st+'">'+(ok ? '' : esc((nameOf(id)[0] || '?')))+'</span>';
  }
  function cid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms || 20); } catch(e){} }
  var toastT = null;
  function toast(msg){
    var el = document.getElementById('toast');
    el.innerHTML = '<div class="toast">'+esc(msg)+'</div>';
    clearTimeout(toastT);
    toastT = setTimeout(function(){ el.innerHTML = ''; }, 1600);
  }
  function live(){ return S.status === 'live' && !!S.host; }

  // ---------- rendering ----------
  var rafId = 0;
  function render(){ if (!rafId) rafId = requestAnimationFrame(function(){ rafId = 0; draw(); }); }

  function statusView(){
    var el = document.getElementById('status');
    var map = {
      live:['live','LIVE'], connecting:['wait','CONNECTING'], notfound:['bad','TRACKER NOT FOUND'],
      offline:['bad','OFFLINE'], idle:['','NOT PAIRED']
    };
    var m = map[S.status] || map.idle;
    el.innerHTML = '<span class="dot '+m[0]+'"></span><span>'+m[1]+'</span>';
    var t = document.getElementById('today');
    if (S.host && S.host.today){
      t.classList.remove('hide');
      t.querySelector('.rec').textContent = S.host.today.w + '–' + S.host.today.l;
    } else t.classList.add('hide');
  }

  function draw(){
    statusView();
    var main = document.getElementById('main');
    if (!S.code){
      if (!document.getElementById('codeInput')){ main._html = ''; setHtml(main, pairView()); }
      drawSheet(); return;
    }
    var h = S.host;
    var out = '';
    if (S.status !== 'live'){
      var bad = S.status === 'notfound' || S.status === 'offline';
      var msg = S.status === 'notfound'
        ? 'Can\'t find the tracker. Open the <b>PHONE</b> tab on the tracker and make sure the remote is on.'
        : S.status === 'offline' ? esc(S.statusMsg || 'No connection. Retrying…')
        : 'Connecting to the tracker…';
      out += '<div class="banner '+(bad ? 'bad' : 'wait')+'"><span>'+msg+'</span>'+(bad ? '<button class="blk" data-act="retry">RETRY</button>' : '')+'</div>';
    }
    if (S.outbox.length){
      out += '<div class="banner wait"><span>'+S.outbox.length+' game'+(S.outbox.length > 1 ? 's' : '')+' waiting to send — they\'ll go through when the tracker reconnects.</span></div>';
    }
    if (!h){
      setHtml(main, out + '<div class="card" style="text-align:center;padding:26px 14px"><div class="blk" style="font-size:15px">WAITING FOR THE TRACKER…</div><div class="empty">Code '+esc(S.code)+'</div></div>' + footView());
      drawSheet(); return;
    }
    var dubs = h.mode === 'doubles';
    var dim = live() ? '' : ' off';
    out += '<div class="seg'+dim+'"><button class="blk'+(!dubs ? ' on' : '')+'" data-act="mode" data-v="solo">1V1</button><button class="blk'+(dubs ? ' on' : '')+'" data-act="mode" data-v="doubles">2V2</button></div>';

    var mineLbl = h.handoffOn ? 'NATHAN · LOGGING' : 'YOUR SIDE';
    var oppLbl = h.handoffOn ? (dubs ? "COOPER'S TEAM" : "COOPER'S SIDE") : 'OPPONENT' + (dubs ? 'S' : '');
    var fb = function(slot, role){
      return '<button class="fbtn" data-act="pick" data-v="'+slot+'">'+chip(h[slot], 44)+'<span class="nm"><b>'+esc(nameOf(h[slot]))+'</b><i>'+role+'</i></span></button>';
    };
    out += '<div class="sides'+dim+'">' +
      '<div class="side"><span class="lbl">'+mineLbl+'</span>' + fb('me', h.handoffOn ? 'NATHAN' : 'COOPER') + (dubs ? fb('partner', h.handoffOn ? 'PARTNER' : 'NATHAN') : '') + '</div>' +
      '<div class="vs blk">VS</div>' +
      '<div class="side"><span class="lbl">'+oppLbl+'</span>' + fb('opp1', dubs ? 'OPP 1' : (h.handoffOn ? 'COOPER' : 'OPP')) + (dubs ? fb('opp2', 'OPP 2') : '') + '</div>' +
    '</div>';

    var ko = function(key, who){
      return '<div class="ko"><span class="who">'+who+'</span><button class="blk" data-act="ko" data-k="'+key+'" data-d="-1" aria-label="minus">−</button><span class="n blk">'+(h[key] || 0)+'</span><button class="blk plus" data-act="ko" data-k="'+key+'" data-d="1" aria-label="plus">+</button></div>';
    };
    out += '<div class="card'+dim+'">' + ko('koMe', "COOPER'S KOs") + (dubs ? ko('koNathan', "NATHAN'S KOs") : '') + '</div>';

    out += '<div class="wl"><button class="big win" data-act="result" data-v="W"><b>WIN</b><i>THEN PICK STOCKS</i></button><button class="big loss" data-act="result" data-v="L"><b>LOSS</b><i>THEN PICK STOCKS</i></button></div>';

    var games = h.games || [];
    out += '<div class="card"><div class="rowhead"><span class="blk">TODAY</span><span class="aside">'+
      (h.today ? (h.today.w + '–' + h.today.l + ' · ' + (h.today.diff > 0 ? '+' : '') + h.today.diff + ' STK' + (h.streak && games.length ? ' · ' + esc(h.streak) + ' STREAK' : '')) : '') + '</span></div>';
    if (!games.length) out += '<div class="empty">No games yet today.</div>';
    else {
      out += '<div class="games">';
      games.forEach(function(g, i){
        var canUndo = i === 0 && g.id === h.lastId && live();
        out += '<div class="g '+(g.result === 'W' ? 'W' : 'L')+'"><span class="b blk">'+(g.result === 'W' ? 'W' : 'L')+'</span><span class="t"><span>'+esc(g.line)+'</span><span>'+
          esc(g.time)+' · '+esc(g.margin)+' STK'+(g.ko ? ' · '+esc(g.ko) : '')+'</span></span>'+
          (canUndo ? '<button class="undo blk'+(S.undoArm === g.id ? ' arm' : '')+'" data-act="undo" data-v="'+esc(g.id)+'">'+(S.undoArm === g.id ? 'SURE?' : 'UNDO')+'</button>' : '')+'</div>';
      });
      out += '</div>';
    }
    out += '</div>';

    var stages = Array.isArray(h.stages) ? h.stages : [];
    var stageName = (stages.filter(function(s){ return s.id === h.stage; })[0] || {}).label || '';
    var wasOpen = !!(document.querySelector('details.set') || {}).open;
    out += '<details class="card set'+dim+'"'+(wasOpen ? ' open' : '')+'><summary><span class="blk" style="font-size:13px;letter-spacing:.06em">MATCH SETTINGS</span><span class="lbl" style="opacity:.6">'+
      esc(h.stocks)+' STK · '+esc(stageName)+' · '+(h.items ? 'ITEMS' : 'NO ITEMS')+'</span></summary><div class="opts">' +
      '<div><span class="lbl">STOCKS PER PLAYER</span><div class="pills">' + [2,3,4,5,6].map(function(v){ return '<button class="'+(h.stocks === v ? 'on' : '')+'" data-act="stocks" data-v="'+v+'">'+v+'</button>'; }).join('') + '</div></div>' +
      '<div><span class="lbl">STAGE</span><div class="pills">' + stages.map(function(s){ return '<button class="'+(h.stage === s.id ? 'on' : '')+'" data-act="stage" data-v="'+esc(s.id)+'">'+esc(s.label)+'</button>'; }).join('') + '</div></div>' +
      '<div><span class="lbl">ITEMS</span><div class="pills"><button class="'+(!h.items ? 'on' : '')+'" data-act="items" data-v="0">NO ITEMS</button><button class="'+(h.items ? 'on' : '')+'" data-act="items" data-v="1">ITEMS ON</button></div></div>' +
      '</div></details>';

    out += footView();
    setHtml(main, out);
    drawSheet();
  }
  function setHtml(el, html){ if (el._html !== html){ el._html = html; el.innerHTML = html; } }

  function footView(){
    return '<div class="foot"><span>CODE '+esc(S.code)+'</span>·<button data-act="unpair">CHANGE</button></div>';
  }

  function pairView(){
    return '<div class="card pair">' +
      '<h1 class="blk">PAIR WITH THE TRACKER</h1>' +
      '<p>On the tracker, open the <b>PHONE</b> tab and turn the remote on. Scan its square code with your camera, or type the 5-letter code here.</p>' +
      '<input id="codeInput" maxlength="5" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="CODE" inputmode="text">' +
      '<button class="go blk" data-act="pair">CONNECT</button>' +
    '</div>';
  }

  function drawSheet(){
    var el = document.getElementById('sheet');
    var h = S.host;
    if (!S.pending || !h){ setHtml(el, ''); return; }
    var dubs = h.mode === 'doubles';
    var max = Math.max(1, Math.min(12, (h.stocks || 3) * (dubs ? 2 : 1)));
    var q = dubs
      ? (S.pending === 'W' ? 'WON WITH HOW MANY TEAM STOCKS LEFT?' : 'LOST — HOW MANY TEAM STOCKS DID THEY HAVE LEFT?')
      : (S.pending === 'W' ? 'WON WITH HOW MANY STOCKS LEFT?' : 'LOST — HOW MANY STOCKS DID THEY HAVE LEFT?');
    var btns = '';
    for (var v = 1; v <= max; v++) btns += '<button data-act="stock" data-v="'+v+'">'+v+'<i>STK</i></button>';
    var kos = '<span>COOPER '+(h.koMe || 0)+' KO</span>' + (dubs ? '<span>NATHAN '+(h.koNathan || 0)+' KO</span>' : '');
    setHtml(el, '<div class="scrim" data-act="cancel"><div class="sheet '+S.pending+'" data-stop="1">' +
      '<div class="sub">'+(S.pending === 'W' ? 'WIN' : 'LOSS')+' · '+esc(nameOf(h.me))+(dubs ? ' + '+esc(nameOf(h.partner)) : '')+' VS '+esc(nameOf(h.opp1))+(dubs ? ' + '+esc(nameOf(h.opp2)) : '')+'</div>' +
      '<div class="q blk">'+q+'</div>' +
      '<div class="stk">'+btns+'</div>' +
      '<div class="kos">'+kos+'</div>' +
      '<div class="row2"><button class="blk" data-act="cancel">CANCEL</button><button class="blk dark" data-act="stock" data-v="0">SKIP STOCKS</button></div>' +
    '</div></div>');
  }

  // ---------- picker ----------
  var SLOT_TITLE = {me:"PICK COOPER'S FIGHTER", partner:"PICK NATHAN'S FIGHTER", opp1:'PICK OPPONENT FIGHTER', opp2:'PICK OPPONENT FIGHTER'};
  function openPicker(slot){
    S.picker = slot; S.search = '';
    var h = S.host;
    var title = SLOT_TITLE[slot];
    if (h && h.handoffOn) title = slot === 'me' ? "PICK NATHAN'S FIGHTER" : slot === 'partner' ? "PICK PARTNER'S FIGHTER" : slot === 'opp1' && h.mode !== 'doubles' ? "PICK COOPER'S FIGHTER" : title;
    document.getElementById('pickerTitle').textContent = title;
    document.getElementById('search').value = '';
    document.getElementById('picker').classList.remove('hide');
    document.body.style.overflow = 'hidden';
    drawPicker();
  }
  function closePicker(){
    S.picker = null;
    document.getElementById('picker').classList.add('hide');
    document.body.style.overflow = '';
    document.getElementById('search').blur();
  }
  function drawPicker(){
    if (!S.picker) return;
    var h = S.host || {};
    var cur = h[S.picker];
    var q = S.search.trim().toLowerCase();
    var match = function(id){ return !q || nameOf(id).toLowerCase().indexOf(q) > -1; };
    var tile = function(id){ return '<button class="tile'+(id === cur ? ' on' : '')+'" data-act="choose" data-v="'+esc(id)+'">'+chip(id, 48)+'<b>'+esc(nameOf(id))+'</b></button>'; };
    var mine = S.picker === 'me' || S.picker === 'partner';
    var recent = ((mine ? h.recentMine : h.recentOpp) || []).filter(function(id){ return S.byId[id] && match(id); });
    var all = S.fighters.map(function(f){ return f.id; }).filter(match);
    var out = '';
    if (recent.length) out += '<div><span class="lbl">RECENT</span><div class="recent">'+recent.map(tile).join('')+'</div></div>';
    out += '<div><span class="lbl">'+(q ? all.length + ' MATCH' + (all.length === 1 ? '' : 'ES') : 'ALL FIGHTERS · ' + all.length)+'</span>' +
      (all.length ? '<div class="grid">'+all.map(tile).join('')+'</div>' : '<div class="empty">No fighters match.</div>') + '</div>';
    document.getElementById('pickerBody').innerHTML = out;
  }

  // ---------- actions ----------
  function localEdit(patch){
    if (!S.host) return;
    var now = Date.now();
    Object.keys(patch).forEach(function(k){ S.host[k] = patch[k]; S.edits[k] = now; });
    render();
  }
  function send(msg){
    if (conn && conn.open){ try { conn.send(msg); return true; } catch(e){} }
    return false;
  }
  function needLive(){
    if (live()) return true;
    toast('NOT CONNECTED YET');
    return false;
  }
  function flushOutbox(){ S.outbox.forEach(function(m){ send(m); }); }

  var handlers = {
    pair: function(){
      var v = (document.getElementById('codeInput').value || '').trim().toUpperCase();
      if (!CODE_RE.test(v)) return toast('CODE IS 5 LETTERS');
      setCode(v);
    },
    unpair: function(){
      if (S.outbox.length && !confirm('Some games haven\'t reached the tracker yet. Forget them and change code?')) return;
      S.code = ''; S.host = null; S.outbox = []; S.pending = null; save();
      try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
      disconnect(); setStatus('idle');
    },
    retry: function(){ disconnect(); connect(); },
    mode: function(el){ if (!needLive()) return; localEdit({mode:el.dataset.v}); send({t:'mode', mode:el.dataset.v}); buzz(); },
    pick: function(el){ if (!needLive()) return; openPicker(el.dataset.v); },
    closePicker: closePicker,
    choose: function(el){
      var slot = S.picker, id = el.dataset.v;
      closePicker();
      if (!slot || !S.byId[id]) return;
      var p = {}; p[slot] = id; localEdit(p);
      send({t:'pick', slot:slot, id:id}); buzz();
    },
    ko: function(el){
      if (!needLive()) return;
      var k = el.dataset.k, v = Math.max(0, Math.min(99, (S.host[k] || 0) + Number(el.dataset.d)));
      var p = {}; p[k] = v; localEdit(p);
      send({t:'ko', key:k, v:v}); buzz(15);
    },
    result: function(el){
      if (!S.host) return toast('NOT CONNECTED YET');
      S.pending = el.dataset.v; buzz(); drawSheet();
    },
    cancel: function(){ S.pending = null; drawSheet(); },
    stock: function(el){
      var h = S.host, result = S.pending;
      if (!h || !result) return;
      var dubs = h.mode === 'doubles';
      var msg = {t:'log', cid:cid(), result:result, margin:Number(el.dataset.v) || 0, mode:h.mode,
        me:h.me, partner:dubs ? h.partner : null, opp1:h.opp1, opp2:dubs ? h.opp2 : null,
        koMe:h.koMe || 0, koNathan:dubs ? (h.koNathan || 0) : 0};
      S.outbox.push(msg); save();
      var sent = send(msg);
      S.pending = null;
      localEdit({koMe:0, koNathan:0});
      buzz([30, 40, 30]);
      toast((result === 'W' ? 'WIN' : 'LOSS') + (sent ? ' SENT' : ' SAVED — WILL SEND'));
    },
    undo: function(el){
      var id = Number(el.dataset.v);
      if (S.undoArm !== id){ S.undoArm = id; render(); setTimeout(function(){ if (S.undoArm === id){ S.undoArm = null; render(); } }, 3000); return; }
      S.undoArm = null;
      if (send({t:'undo', id:id})) { buzz(); toast('UNDONE'); } else toast('NOT CONNECTED');
    },
    stocks: function(el){ if (!needLive()) return; var v = Number(el.dataset.v); localEdit({stocks:v}); send({t:'stocks', v:v}); },
    stage: function(el){ if (!needLive()) return; localEdit({stage:el.dataset.v}); send({t:'stage', id:el.dataset.v}); },
    items: function(el){ if (!needLive()) return; var v = el.dataset.v === '1'; localEdit({items:v}); send({t:'items', v:v}); }
  };

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]');
    if (!el) return;
    if (el.dataset.act === 'cancel' && e.target.closest('[data-stop]') && !e.target.closest('button')) return;
    var fn = handlers[el.dataset.act];
    if (fn){ e.preventDefault(); fn(el); }
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && e.target && e.target.id === 'codeInput') handlers.pair();
    if (e.key === 'Escape'){ if (S.picker) closePicker(); else if (S.pending){ S.pending = null; drawSheet(); } }
  });
  document.getElementById('search').addEventListener('input', function(e){ S.search = e.target.value || ''; drawPicker(); });

  // ---------- incoming ----------
  function onData(d){
    if (!d || typeof d !== 'object') return;
    switch (d.t){
      case 'pong': return;
      case 'roster':
        if (!Array.isArray(d.fighters)) return;
        S.fighters = d.fighters.filter(function(f){ return f && typeof f.id === 'string'; });
        indexFighters();
        if (d.fresh){ S.images = {}; S.rv = ''; }
        render(); if (S.picker) drawPicker();
        return;
      case 'img':
        if (typeof d.id === 'string' && typeof d.src === 'string') S.images[d.id] = d.src;
        render();
        return;
      case 'rosterdone':
        S.rv = String(d.rv || ''); save(); render(); if (S.picker) drawPicker();
        return;
      case 'state': {
        var now = Date.now(), prev = S.host || {};
        var next = Object.assign({}, d);
        delete next.t;
        Object.keys(S.edits).forEach(function(k){
          if (now - S.edits[k] < 900) next[k] = prev[k]; else delete S.edits[k];
        });
        S.host = next;
        save(); render();
        return;
      }
      case 'ack': {
        var n = S.outbox.length;
        S.outbox = S.outbox.filter(function(m){ return m.cid !== d.cid; });
        if (S.outbox.length !== n){ save(); render(); }
        return;
      }
    }
  }

  // ---------- connection ----------
  var peer = null, conn = null, retryT = null, openT = null, lastMsg = 0;

  function setStatus(st, msg){
    S.status = st; S.statusMsg = msg || '';
    if (st !== 'live' && S.pending && !S.host) S.pending = null;
    render();
  }
  function setCode(code){
    S.code = code; S.host = null; save();
    try { history.replaceState(null, '', '#' + code); } catch(e){ location.hash = code; }
    disconnect(); connect();
  }
  function retry(ms){ clearTimeout(retryT); retryT = setTimeout(connect, ms); }
  function dropConn(){
    var c = conn; conn = null; clearTimeout(openT);
    if (c){ try { c.close(); } catch(e){} }
  }
  function disconnect(){
    clearTimeout(retryT); dropConn();
    var p = peer; peer = null;
    if (p){ try { p.destroy(); } catch(e){} }
  }
  function connect(){
    clearTimeout(retryT);
    if (!S.code) return;
    if (conn && conn.open) return;
    if (typeof window.Peer !== 'function'){ setStatus('offline', 'Could not load the connection library — check your internet, then tap RETRY.'); return; }
    if (S.status !== 'notfound') setStatus('connecting');
    if (!peer || peer.destroyed){
      var p = peer = new window.Peer(peerOpts());
      p.on('open', function(){ if (peer === p) dial(); });
      p.on('disconnected', function(){
        if (peer !== p || p.destroyed) return;
        setTimeout(function(){ if (peer === p && !p.destroyed && p.disconnected){ try { p.reconnect(); } catch(e){ disconnect(); retry(1500); } } }, 1000);
      });
      p.on('error', function(err){
        if (peer !== p) return;
        var type = err && err.type;
        if (type === 'peer-unavailable'){ dropConn(); setStatus('notfound'); retry(3000); return; }
        if (type === 'browser-incompatible'){ setStatus('offline', 'This browser can\'t connect to the tracker.'); return; }
        disconnect();
        setStatus(navigator.onLine === false ? 'offline' : 'connecting', navigator.onLine === false ? 'No internet on this phone.' : '');
        retry(3000);
      });
    } else if (peer.open) dial();
    else if (peer.disconnected){ try { peer.reconnect(); } catch(e){ disconnect(); retry(1000); } }
  }
  function dial(){
    if (conn && (conn.open || conn._dialing)) return;
    var c = conn = peer.connect(PREFIX + S.code, {reliable:true});
    c._dialing = true;
    clearTimeout(openT);
    openT = setTimeout(function(){ if (conn === c && !c.open){ dropConn(); retry(300); } }, 10000);
    c.on('open', function(){
      if (conn !== c) return;
      c._dialing = false; clearTimeout(openT);
      lastMsg = Date.now();
      setStatus('live');
      c.send({t:'hello', rv:S.rv});
      flushOutbox();
    });
    c.on('data', function(d){ if (conn === c){ lastMsg = Date.now(); onData(d); } });
    c.on('close', function(){ if (conn === c){ conn = null; clearTimeout(openT); if (S.status === 'live') setStatus('connecting'); retry(800); } });
    c.on('error', function(){ if (conn === c){ dropConn(); retry(1500); } });
  }
  function heartbeat(){
    if (!S.code) return;
    if (conn && conn.open){
      if (Date.now() - lastMsg > 12000){ dropConn(); setStatus('connecting'); connect(); return; }
      send({t:'ping'});
    } else if (!conn) connect();
  }
  setInterval(heartbeat, 4000);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible' || !S.code) return;
    if (conn && conn.open && Date.now() - lastMsg < 9000) return send({t:'ping'});
    dropConn(); connect();
  });
  window.addEventListener('online', function(){ if (S.code){ disconnect(); connect(); } });

  // ---------- boot ----------
  load();
  var fromHash = (location.hash || '').replace('#', '').trim().toUpperCase();
  if (CODE_RE.test(fromHash) && fromHash !== S.code){ S.code = fromHash; S.host = null; S.outbox = []; save(); }
  else if (S.code && !fromHash){ try { history.replaceState(null, '', '#' + S.code); } catch(e){} }
  window.addEventListener('hashchange', function(){
    var v = (location.hash || '').replace('#', '').trim().toUpperCase();
    if (CODE_RE.test(v) && v !== S.code) setCode(v);
  });
  draw();
  if (S.code) connect();
})();
</script>
</body>
</html>
