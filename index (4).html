  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rap:wrap;gap:14px;padding-top:11px;margin-top:4px;border-top:2.5px dashed rgba(23,20,15,.28)\">\n            <sc-for list=\"{{ koRows }}\" as=\"k\" hint-placeholder-count=\"1\">\n              <div style=\"display:flex;align-items:center;gap:9px\">\n                <span style=\"{{ k.labelStyle }}\">{{ k.who }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ k.minus }}\" style=\"{{ k.btnStyle }}\">–<\u002Fbutton>\n                <span style=\"{{ k.valueStyle }}\">{{ k.value }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ k.plus }}\" style=\"{{ k.btnStyle }}\">+<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <span style=\"align-self:center;font-size:10.5px;font-weight:700;letter-spacing:.04em;opacity:.55\">Optional — leave at 0 to skip<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n          <button sc-camel-on-click=\"{{ tapWin }}\" style=\"{{ winBtnStyle }}\">\n            <span style=\"font-family:'Archivo Black';font-size:clamp(30px,6vw,42px);line-height:.95;letter-spacing:.02em\">WIN<\u002Fspan>\n            <span style=\"font-size:10px;font-weight:800;letter-spacing:.24em;opacity:.8\">{{ winSub }}<\u002Fspan>\n          <\u002Fbutton>\n          <button sc-camel-on-click=\"{{ tapLoss }}\" style=\"{{ lossBtnStyle }}\">\n            <span style=\"font-family:'Archivo Black';font-size:clamp(30px,6vw,42px);line-height:.95;letter-spacing:.02em\">LOSS<\u002Fspan>\n            <span style=\"font-size:10px;font-weight:800;letter-spacing:.24em;opacity:.8\">{{ lossSub }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <sc-for list=\"{{ quickActions }}\" as=\"a\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ a.go }}\" style=\"{{ a.style }}\">{{ a.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fffdf7;border:4px solid #17140f;border-radius:14px;box-shadow:5px 5px 0 #17140f;padding:14px\">\n        <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:11px\">\n          <span style=\"font-family:'Archivo Black';font-size:13px;letter-spacing:.06em\">MATCH LOG<\u002Fspan>\n          <span style=\"flex:1;height:3px;background:#17140f;opacity:.12;border-radius:3px\"><\u002Fspan>\n          <span style=\"font-size:10px;font-weight:800;letter-spacing:.12em;opacity:.5\">{{ todayCount }} GAMES<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasToday }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto\">\n          <sc-for list=\"{{ timeline }}\" as=\"m\" hint-placeholder-count=\"4\">\n            <div style=\"{{ m.rowStyle }}\">\n              <span style=\"{{ m.badgeStyle }}\">{{ m.result }}<\u002Fspan>\n              <span style=\"display:flex;flex-direction:column;gap:1px;min-width:0\">\n                <span style=\"font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ m.line }}<\u002Fspan>\n                <span style=\"font-size:10px;font-weight:700;letter-spacing:.08em;opacity:.45\">{{ m.sub }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"margin-left:auto;display:flex;align-items:center;gap:9px\">\n                <span style=\"font-size:11px;font-weight:800;opacity:.55;white-space:nowrap\">{{ m.margin }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ m.edit }}\" style=\"padding:4px 8px;background:#fffdf7;border:2.5px solid #17140f;border-radius:7px;font-family:'Archivo Black';font-size:9.5px;letter-spacing:.06em\" style-hover=\"background:#ffd400\">EDIT<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ m.del }}\" style=\"font-size:13px;font-weight:800;opacity:.35;padding:0 2px\" style-hover=\"opacity:1\">✕<\u002Fbutton>\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noToday }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:24px 8px;text-align:center;font-weight:700;font-size:13px;opacity:.45\">No games yet today. Pick your fighter and hit WIN or LOSS.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <aside style=\"flex:1 1 300px;min-width:262px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"background:#fffdf7;border:4px solid #17140f;border-radius:14px;box-shadow:5px 5px 0 #17140f;padding:14px\">\n        <div style=\"font-family:'Archivo Black';font-size:13px;letter-spacing:.06em;margin-bottom:12px\">TODAY BY FIGHTER<\u002Fdiv>\n        <sc-if value=\"{{ hasToday }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <sc-for list=\"{{ todayByChar }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;flex-direction:column;gap:5px\">\n              <div style=\"display:flex;align-items:center;gap:8px\">\n                <span style=\"{{ c.chip }}\">{{ c.initial }}<\u002Fspan>\n                <span style=\"font-family:'Archivo Black';font-size:13px\">{{ c.name }}<\u002Fspan>\n                <span style=\"margin-left:auto;font-size:11px;font-weight:700;opacity:.5\">{{ c.record }}<\u002Fspan>\n                <span style=\"font-family:'Archivo Black';font-size:13px;width:44px;text-align:right\">{{ c.rate }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:10px;background:#efe5cd;border:2.5px solid #17140f;border-radius:20px;overflow:hidden\">\n                <div style=\"{{ c.barStyle }}\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noToday }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12.5px;font-weight:700;opacity:.4\">Splits appear after your first game.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"background:#2ea86a;color:#fffdf7;border:4px solid #17140f;border-radius:14px;box-shadow:5px 5px 0 #17140f;padding:14px\">\n        <div style=\"font-family:'Archivo Black';font-size:13px;letter-spacing:.06em;margin-bottom:11px\">READ ON THE SESSION<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <sc-for list=\"{{ insights }}\" as=\"i\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:9px;align-items:flex-start\">\n              <span style=\"flex:none;width:22px;height:22px;border-radius:6px;background:#fffdf7;border:2.5px solid #17140f;color:#17140f;font-family:'Archivo Black';font-size:11px;display:flex;align-items:center;justify-content:center\">{{ i.icon }}<\u002Fspan>\n              <span style=\"font-size:12.5px;font-weight:600;line-height:1.4\">{{ i.text }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fffdf7;border:4px solid #17140f;border-radius:14px;box-shadow:5px 5px 0 #17140f;padding:14px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-family:'Archivo Black';font-size:13px;letter-spacing:.06em\">SESSION SETUP<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-size:10px;font-weight:800;letter-spacing:.16em;opacity:.5\">PLAYING AGAINST<\u002Fspan>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n            <sc-for list=\"{{ playerChips }}\" as=\"p\" hint-placeholder-count=\"1\">\n              <button sc-camel-on-click=\"{{ p.go }}\" style=\"{{ p.style }}\">{{ p.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:6px\">\n            <input value=\"{{ newPlayer }}\" sc-camel-on-change=\"{{ onNewPlayer }}\" placeholder=\"Add a rival\" style=\"flex:1;min-width:0;padding:7px 9px;background:#f7efdb;border:2.5px solid #17140f;border-radius:8px;font-family:Archivo;font-weight:700;font-size:12px;color:#17140f\">\n            <button sc-camel-on-click=\"{{ addPlayer }}\" style=\"padding:7px 11px;background:#17140f;color:#fffdf7;border:2.5px solid #17140f;border-radius:8px;font-family:'Archivo Black';font-size:11px\">ADD<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-size:10px;font-weight:800;letter-spacing:.16em;opacity:.5\">STOCK COUNT<\u002Fspan>\n          <div style=\"display:flex;gap:6px\">\n            <sc-for list=\"{{ stockSetting }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ s.go }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ handoff }}\" style=\"padding:11px;background:#ffd400;border:3px solid #17140f;border-radius:10px;box-shadow:3px 3px 0 #17140f;font-family:'Archivo Black';font-size:12px;letter-spacing:.06em;text-align:center\" style-hover=\"background:#ffe14d\">{{ handoffLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ endSession }}\" style=\"padding:11px;background:#17140f;color:#fffdf7;border:3px solid #17140f;border-radius:10px;font-family:'Archivo Black';font-size:12px;letter-spacing:.06em\" style-hover=\"background:#2d2820\">END SESSION &amp; SEE RECAP<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ================= ROSTER ================= -->\n  <sc-if value=\"{{ isRoster }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1200px;margin:0 auto;padding:18px clamp(12px,3vw,26px) 0;display:flex;flex-direction:column;gap:16px\">\n    <section style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px;background:#ffd400;border:4px solid #17140f;border-radius:14px;box-shadow:6px 6px 0 #17140f\">\n      <div style=\"min-width:220px;flex:1 1 320px\">\n        <div style=\"font-family:'Archivo Black';font-size:18px;letter-spacing:.02em\">FIGHTER CUSTOMIZER<\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:600;line-height:1.45;opacity:.72;margin-top:4px\">Name every slot however you and Nathan call them, and drag an image straight onto a card to set its portrait. Everything saves to this device and carries through the match log, stats, recap and CSV.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n        <button sc-camel-on-click=\"{{ addFighter }}\" style=\"padding:11px 15px;background:#17140f;color:#fffdf7;border:3px solid #17140f;border-radius:10px;box-shadow:4px 4px 0 rgba(232,64,42,.9);font-family:'Archivo Black';font-size:12px;letter-spacing:.06em;white-space:nowrap\" style-hover=\"background:#2d2820\">+ ADD FIGHTER<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ resetNames }}\" style=\"padding:11px 15px;background:#fffdf7;border:3px solid #17140f;border-radius:10px;box-shadow:4px 4px 0 #17140f;font-family:'Archivo Black';font-size:12px;letter-spacing:.06em;white-space:nowrap\" style-hover=\"background:#e8402a;color:#fffdf7\">RESET ROSTER<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:11px\">\n      <sc-for list=\"{{ rosterAll }}\" as=\"r\" hint-placeholder-count=\"16\">\n        <div sc-camel-on-drag-over=\"{{ r.onDragOver }}\" sc-camel-on-drag-leave=\"{{ r.onDragLeave }}\" sc-camel-on-drop=\"{{ r.onDrop }}\" style=\"{{ r.tileStyle }}\">\n          <span style=\"{{ r.chip }}\">{{ r.initial }}<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:6px;flex:1;min-width:0\">\n            <input value=\"{{ r.name }}\" sc-camel-on-change=\"{{ r.rename }}\" placeholder=\"{{ r.placeholder }}\" style=\"width:100%;padding:8px 10px;background:#f7efdb;border:2.5px solid #17140f;border-radius:8px;font-family:'Archivo Black';font-size:13.5px;color:#17140f\">\n            <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px\">\n              <label style=\"display:inline-flex;align-items:center;gap:5px;padding:5px 9px;background:#ffd400;border:2.5px solid #17140f;border-radius:7px;font-family:'Archivo Black';font-size:9.5px;letter-spacing:.08em;cursor:pointer;white-space:nowrap\">\n                <span>▣ {{ r.photoHint }}<\u002Fspan>\n                <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ r.upload }}\" style=\"display:none\">\n              <\u002Flabel>\n              <sc-if value=\"{{ r.hasPhoto }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ r.clearPhoto }}\" style=\"padding:5px 8px;background:#fffdf7;border:2.5px solid #17140f;border-radius:7px;font-family:'Archivo Black';font-size:9.5px;letter-spacing:.08em\">CLEAR<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ r.isCustom }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ r.removeFighter }}\" style=\"padding:5px 8px;background:#e8402a;color:#fffdf7;border:2.5px solid #17140f;border-radius:7px;font-family:'Archivo Black';font-size:9.5px;letter-spacing:.08em\">DELETE<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <span style=\"font-size:10.5px;font-weight:700;letter-spacing:.06em;opacity:.5\">{{ r.record }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ================= RANDOM ================= -->\n  <sc-if value=\"{{ isRandom }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1200px;margin:0 auto;padding:18px clamp(12px,3vw,26px) 0;display:flex;flex-direction:column;gap:16px\">\n    <section style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px;background:#1f6fd0;color:#fffdf7;border:4px solid #17140f;border-radius:14px;box-shadow:6px 6px 0 #17140f\">\n      <div style=\"min-width:220px;flex:1 1 320px\">\n        <div style=\"font-family:'Archivo Black';font-size:18px;letter-spacing:.02em\">RANDOMIZER MIX<\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:600;line-height:1.45;opacity:.85;margin-top:4px\">Tap a fighter to pull them out of the random pool. The session RANDOM buttons only roll from fighters marked IN.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:9px;align-items:center\">\n        <span style=\"padding:9px 12px;background:rgba(255,253,247,.16);border:2.5px solid rgba(255,253,247,.6);border-radius:9px;font-family:'Archivo Black';font-size:11.5px;letter-spacing:.08em;white-space:nowrap\">{{ poolCount }}<\u002Fspan>\n        <button sc-camel-on-click=\"{{ poolAll }}\" style=\"padding:10px 14px;background:#fffdf7;color:#17140f;border:3px solid #17140f;border-radius:10px;box-shadow:4px 4px 0 #17140f;font-family:'Archivo Black';font-size:11.5px;letter-spacing:.06em\">ALL IN<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ poolNone }}\" style=\"padding:10px 14px;background:#17140f;color:#fffdf7;border:3px solid #17140f;border-radius:10px;box-shadow:4px 4px 0 rgba(232,64,42,.9);font-family:'Archivo Black';font-size:11.5px;letter-spacing:.06em\">CLEAR ALL<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"position:relative;display:flex;flex-wrap:wrap;gap:16px;align-items:stretch;padding:24px 18px 18px;background:#fffdf7;background-image:repeating-linear-gradient(115deg, rgba(23,20,15,.045) 0 12px, transparent 12px 34px);border:4px solid #17140f;border-radius:14px;box-shadow:6px 6px 0 #17140f\">\n      <div style=\"position:absolute;top:-13px;left:18px;padding:4px 10px;background:#17140f;color:#ffd400;border-radius:6px;font-family:'Archivo Black';font-size:10px;letter-spacing:.16em\">{{ stageStatus }}<\u002Fdiv>\n      <sc-for list=\"{{ stageMine }}\" as=\"p\" hint-placeholder-count=\"1\">\n        <div style=\"{{ p.cardStyle }}\">\n          <span style=\"{{ p.chip }}\">{{ p.initial }}<\u002Fspan>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:7px\">\n            <span style=\"{{ p.labelStyle }}\">{{ p.who }} · {{ p.sub }}<\u002Fspan>\n            <span style=\"font-family:'Archivo Black';font-size:17px;letter-spacing:.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.name }}<\u002Fspan>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px\">\n              <sc-for list=\"{{ p.stats }}\" as=\"x\" hint-placeholder-count=\"4\">\n                <div style=\"{{ p.statStyle }}\">\n                  <span style=\"font-size:8.5px;font-weight:800;letter-spacing:.14em;opacity:.55\">{{ x.label }}<\u002Fspan>\n                  <span style=\"font-family:'Archivo Black';font-size:13px\">{{ x.value }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <button sc-camel-on-click=\"{{ toggleStageMode }}\" title=\"Switch between head-to-head and teamed up\" style=\"{{ stageJoinStyle }}\">\n        <span style=\"display:block;transform:skewX(8deg);font-family:'Archivo Black';font-size:17px;color:#fffdf7\">{{ stageJoin }}<\u002Fspan>\n      <\u002Fbutton>\n      <sc-for list=\"{{ stageTheirs }}\" as=\"p\" hint-placeholder-count=\"1\">\n        <div style=\"{{ p.cardStyle }}\">\n          <span style=\"{{ p.chip }}\">{{ p.initial }}<\u002Fspan>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:7px\">\n            <span style=\"{{ p.labelStyle }}\">{{ p.who }} · {{ p.sub }}<\u002Fspan>\n            <span style=\"font-family:'Archivo Black';font-size:17px;letter-spacing:.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.name }}<\u002Fspan>\n            <sc-if value=\"{{ p.untracked }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-size:11.5px;font-weight:700;line-height:1.4;opacity:.5\">No stats kept for an untagged 1v1 opponent. Tag them as a rival in Session Setup to start tracking.<\u002Fspan>\n            <\u002Fsc-if>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px\">\n              <sc-for list=\"{{ p.stats }}\" as=\"x\" hint-placeholder-count=\"4\">\n                <div style=\"{{ p.statStyle }}\">\n                  <span style=\"font-size:8.5px;font-weight:800;letter-spacing:.14em;opacity:.55\">{{ x.label }}<\u002Fspan>\n                  <span style=\"font-family:'Archivo Black';font-size:13px\">{{ x.value }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n\n    <section style=\"display:flex;flex-wrap:wrap;gap:10px\">\n      <button sc-camel-on-click=\"{{ rollMe }}\" style=\"flex:1 1 220px;padding:15px;background:#ffd400;border:4px solid #17140f;border-radius:12px;box-shadow:5px 5px 0 #17140f;font-family:'Archivo Black';font-size:14px;letter-spacing:.06em\" style-hover=\"background:#ffe14d\">◇ ROLL MY FIGHTER<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ rollBoth }}\" style=\"flex:1 1 220px;padding:15px;background:#2ea86a;color:#fffdf7;border:4px solid #17140f;border-radius:12px;box-shadow:5px 5px 0 #17140f;font-family:'Archivo Black';font-size:14px;letter-spacing:.06em\" style-hover=\"background:#37c07b\">◈ ROLL ME + NATHAN<\u002Fbutton>\n    <\u002Fsection>\n\n    <section style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px\">\n      <sc-for list=\"{{ poolList }}\" as=\"p\" hint-placeholder-count=\"16\">\n        <button sc-camel-on-click=\"{{ p.toggle }}\" style=\"{{ p.style }}\">\n          <span style=\"{{ p.chip }}\">{{ p.initial }}<\u002Fspan>\n          <span style=\"font-family:'Archivo Black';font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.name }}<\u002Fspan>\n          <span style=\"{{ p.badgeStyle }}\">{{ p.state }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ================= TIERS ================= -->\n  <sc-if value=\"{{ isTiers }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1500px;margin:0 auto;padding:18px clamp(12px,3vw,26px) 0;display:flex;flex-direction:column;gap:16px\">\n    <section style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px;background:#ffd400;background-image:repeating-linear-gradient(115deg, rgba(23,20,15,.07) 0 10px, transparent 10px 30px);border:4px solid #17140f;border-radius:14px;box-shadow:6px 6px 0 #17140f\">\n      <div style=\"flex:1 1 300px;min-width:240px\">\n        <div style=\"font-family:'Archivo Black';font-size:18px;letter-spacing:.02em\">YOUR TIER LIST<\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:600;line-height:1.45;opacity:.72;margin-top:4px\">One list per player, built from your own win rates. S is 65%+, A 55%+, B 45%+, C 35%+, D below that. Nathan's counts his doubles picks and any 1v1 where he's tagged as the rival.<\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"padding:9px 12px;background:#fffdf7;border:3px solid #17140f;border-radius:9px;font-family:'Archivo Black';font-size:11.5px;letter-spacing:.08em;white-space:nowrap\">{{ tierMinLabel }}<\u002Fspan>\n    <\u002Fsection>\n\n    <section style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start\">\n    <sc-for list=\"{{ tierLists }}\" as=\"t\" hint-placeholder-count=\"2\">\n      <div style=\"{{ t.cardStyle }}\">\n        <div style=\"display:flex;flex-wrap:wra :800;letter-spacing:.14em;opacity:.5\">{{ calSummary }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"overflow-x:auto;padding-bottom:6px\">\n        <div style=\"display:inline-flex;flex-direction:column;gap:3px;min-width:min-content\">\n          <div style=\"display:flex;gap:3px\">\n            <sc-for list=\"{{ calMonths }}\" as=\"m\" hint-placeholder-count=\"53\">\n              <span style=\"{{ m.style }}\">{{ m.label }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:3px\">\n            <sc-for list=\"{{ calWeeks }}\" as=\"w\" hint-placeholder-count=\"53\">\n              <div style=\"display:flex;flex-direction:column;gap:3px\">\n                <sc-for list=\"{{ w.days }}\" as=\"d\" hint-placeholder-count=\"7\">\n                  <span title=\"{{ d.title }}\" style=\"{{ d.style }}\"><\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#fffdf7;border:4px solid #17140f;border-top-width:9px;border-top-color:#ffd400;border-radius:14px;box-shadow:6px 6px 0 #17140f;padding:16px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:13px\">\n        <span style=\"font-family:'Archivo Black';font-size:14px;letter-spacing:.04em\">MILESTONES<\u002Fspan>\n        <span style=\"flex:1;height:3px;background:#17140f;opacity:.12;border-radius:3px\"><\u002Fspan>\n        <span style=\"font-size:10px;font-weight:800;letter-spacing:.14em;opacity:.5\">{{ milestoneCount }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px\">\n        <sc-for list=\"{{ milestones }}\" as=\"g\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font-size:10px;font-weight:800;letter- Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:7px\">\n          <span style=\"font-size:10px;font-weight:800;letter-spacing:.16em;opacity:.5\">KOs<\u002Fspan>\n          <div style=\"display:flex;flex-wrap:wrap;gap:14px\">\n            <sc-for list=\"{{ editKos }}\" as=\"k\" hint-placeholder-count=\"1\">\n              <div style=\"display:flex;align-items:center;gap:8px\">\n                <span style=\"{{ k.labelStyle }}\">{{ k.who }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ k.minus }}\" style=\"{{ k.btnStyle }}\">–<\u002Fbutton>\n                <span style=\"{{ k.valueStyle }}\">{{ k.value }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ k.plus }}\" style=\"{{ k.btnStyle }}\">+<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-for list=\"{{ editFighters }}\" as=\"sl\" hint-placeholder-count=\"2\">\n          <div style=\"display:flex;flex-direction:column;gap:7px;padding:11px;background:#fffdf7;border:3px solid #17140f;border-radius:11px\">\n            <div style=\"display:flex;align-items:center;gap:9px\">\n              <span style=\"{{ sl.chip }}\">{{ sl.initial }}<\u002Fspan>\n              <span style=\"display:flex;flex-direction:column;gap:1px\">\n                <span style=\"font-size:9px;font-weight:800;letter-spacing:.18em;opacity:.5\">{{ sl.role }}<\u002Fspan>\n                <span style=\"font-family:'Archivo Black';font-size:14px\">{{ sl.name }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:5px;max-height:104px;overflow:auto\">\n              <sc-for list=\"{{ sl.options }}\" as=\"o\" hint-placeholder-count=\"10\">\n                <button sc-camel-on-click=\"{{ o.go }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <div style=\"display:flex;gap:9px\">\n          <button sc-camel-on-click=\"{{ deleteEdit }}\" style=\"flex:1;padding:12px;background:#e8402a;color:#fffdf7;border:3px solid #17140f;border-radius:10px;font-family:'Archivo Black';font-size:12px;letter-spacing:.06em\">DELETE GAME<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ closeEdit }}\" style=\"flex:1;padding:12px;background:#17140f;color:#fffdf7;border:3px solid #17140f;border-radius:10px;font-family:'Archivo Black';font-size:12px;letter-spacing:.06em\">DONE<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ================= STATS ================= -->\n  <sc-if value=\"{{ isStats }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1500px;margin:0 auto;padding:18px clamp(12px,3vw,26px) 0;display:flex;flex-direction:column;gap:16px\">\n\n    <section style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:stretch\">\n      <sc-for list=\"{{ lifetimeSplits }}\" as=\"m\" hint-placeholder-count=\"2\">\n        <div style=\"{{ m.cardStyle }}\">\n          <div style=\"display:flex;align-items:center;gap:9px\">\n            <span style=\"font-family:'Archivo Black';font-size:14px;letter-spacing:.04em\">{{ m.label }}<\u002Fspan>\n            <span style=\"margin-left:auto;font-family:'Archivo Black';font-size:22px\">{{ m.record }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:12px;background:#efe5cd;border:2.5px solid #17140f;border-radius:20px;overflow:hidden\">\n            <div style=\"{{ m.barStyle }}\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n            <sc-for list=\"{{ m.rows }}\" as=\"x\" hint-placeholder-count=\"4\">\n              <div style=\"flex:1 1 90px;display:flex;flex-direction:column;gap:1px;padding:8px 10px;background:rgba(23,20,15,.06);border:2px solid #17140f;border-radius:8px\">\n                <span style=\"font-size:9px;font-weight:80 " hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <span style=\"font-size:11px;font-weight:800;letter-spacing:.12em;opacity:.55\">{{ s.label }}<\u002Fspan>\n                <span style=\"flex:1;height:3px;background:#17140f;opacity:.1;border-radius:3px\"><\u002Fspan>\n                <span style=\"{{ s.valueStyle }}\">{{ s.value }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ================= PICKER ================= -->\n  <sc-if value=\"{{ pickerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closePicker }}\" style=\"position:fixed;inset:0;z-index:90;background:rgba(23,20,15,.6);display:flex;align-items:flex-end;justify-content:center;padding:0\">\n    <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:760px;max-height:86vh;overflow:auto;background:#f4ecd8;border:4px solid #17140f;border-radius:18px 18px 0 0;padding:16px;animation:rise .18s ease\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px\">\n        <span style=\"font-family:'Archivo Black';font-size:16px;letter-spacing:.02em\">{{ pickerTitle }}<\u002Fspan>\n        <button sc-camel-on-click=\"{{ toggleRename }}\" style=\"{{ renameBtnStyle }}\">{{ renameBtnLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ closePicker }}\" style=\"width:32px;height:32px;background:#fffdf7;border:3px solid #17140f;border-radius:9px;font-family:'Archivo Black';font-size:13px\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ renameMode }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:7px\">\n        <div style=\"font-size:11.5px;font-weight:700;line-height:1.45;opacity:.6;margin-bottom:3px\">Name each slot however you and Nathan call them. Names save to this device and apply everywhere in the app.<\u002Fdiv>\n        <sc-for list=\"{{ rosterAll }}\" as=\"r\" hint-placeholder-count=\"16\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:7px 9px;background:#fffdf7;border:2.5px solid #17140f;border-radius:10px\">\n            <span style=\"{{ r.chip }}\">{{ r.initial }}<\u002Fspan>\n            <input value=\"{{ r.name }}\" sc-camel-on-change=\"{{ r.rename }}\" placeholder=\"{{ r.placeholder }}\" style=\"flex:1;min-width:0;padding:8px 10px;background:#f7efdb;border:2.5px solid #17140f;border-radius:8px;font-family:'Archivo Black';font-size:13px;color:#17140f;letterSpacing:.02em\">\n            <span style=\"font-size:10.5px;font-weight:700;opacity:.5;white-space:nowrap\">{{ r.record }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ pickMode }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:12px\">\n        <div style=\"flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fffdf7;border:3px solid #17140f;border-radius:10px;box-shadow:3px 3px 0 #17140f\">\n          <span style=\"font-family:'Archivo Black';font-size:13px;opacity:.4\">⌕<\u002Fspan>\n          <input value=\"{{ searchValue }}\" sc-camel-on-change=\"{{ onSearch }}\" placeholder=\"Search fighters\" style=\"flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:'Archivo Black';font-size:14px;color:#17140f;letterSpacing:.02em\">\n          <sc-if value=\"{{ hasSearch }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ clearSearch }}\" style=\"font-family:'Archivo Black';font-size:12px;opacity:.45;padding:0 2px\" style-hover=\"opacity:1\">✕<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <span style=\"font-size:10px;font-weight:800;letter-spacing:.14em;opacity:.45;white-space:nowrap\">{{ searchCount }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasRecent }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:7px;margin-bottom:13px;padding-bottom:13px;border-bottom:3px dashed rgba(23,20,15,.16)\">\n        <span style=\"font-size:10px;font-weight:800;letter-spacing:.16em;opacity:.5\">RECENTLY PLAYED<\u002Fspan>\n        <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n          <sc-for list=\"{{ recentPicks }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ r.go }}\" style=\"{{ r.style }}\" style-hover=\"background:#ffd400\">\n              <span style=\"{{ r.chip }}\">{{ r.initial }}<\u002Fspan>\n              <span>{{ r.name }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:22px 8px;text-align:center;font-weight:700;font-size:13px;opacity:.45\">No fighter by that name. Rename slots in the ROSTER tab.<\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px\">\n        <sc-for list=\"{{ roster }}\" as=\"r\" hint-placeholder-count=\"16\">\n          <button sc-camel-on-click=\"{{ r.go }}\" style=\"{{ r.style }}\">\n            <span style=\"{{ r.chip }}\">{{ r.initial }}<\u002Fspan>\n            <span style=\"font-family:'Archivo Black';font-size:12px;letter-spacing:.01em\">{{ r.name }}<\u002Fspan>\n            <span style=\"font-size:9.5px;font-weight:700;letter-spacing:.06em;opacity:.55\">{{ r.record }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n        <button sc-camel-on-click=\"{{ addFighter }}\" style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:11px 6px;background:#17140f;color:#fffdf7;border:3px dashed #ffd400;border-radius:11px\">\n          <span style=\"font-family:'Archivo Black';font-size:22px;line-height:1\">+<\u002Fspan>\n          <span style=\"font-family:'Archivo Black';font-size:11px;letter-spacing:.06em\">ADD FIGHTER<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ================= RECAP ================= -->\n  <sc-if value=\"{{ recapOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeRecap }}\" style=\"position:fixed;inset:0;z-index:95;background:rgba(23,20,15,.66);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto\">\n    <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:420px;background:#ffd400;border:5px solid #17140f;border-radius:18px;box-shadow:10px 10px 0 #17140f;padding:20px;animation:pop .22s ease\">\n      <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:14px\">\n        <div style=\"width:26px;height:26px;background:#e8402a;border:2.5px solid #17140f;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'Archivo Black';font-size:13px;color:#fffdf7\">S<\u002Fdiv>\n        <span style=\"font-family:'Archivo Black';font-size:13px;letter-spacing:.14em\">SESSION RECAP<\u002Fspan>\n        <span style=\"margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.12em;opacity:.6\">{{ todayLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#fffdf7;border:3px solid #17140f;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;align-items:baseline;gap:8px\">\n          <span style=\"font-family:'Archivo Black';font-size:64px;line-height:.85;color:#2ea86a\">{{ todayW }}<\u002Fspan>\n          <span style=\"font-family:'Archivo Black';font-size:30px;opacity:.25\">–<\u002Fspan>\n          <span style=\"font-family:'Archivo Black';font-size:64px;line-height:.85;color:#e8402a\">{{ todayL }}<\u002Fspan>\n          <span style=\"margin-left:auto;font-family:'Archivo Black';font-size:26px\">{{ todayRate }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:3px;height:16px\">\n          <sc-for list=\"{{ recapDots }}\" as=\"d\" hint-placeholder-count=\"10\">\n            <span style=\"{{ d.style }}\"><\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ recapLines }}\" as=\"l\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700\">\n              <span style=\"font-size:10px;font-weight:800;letter-spacing:.14em;opacity:.5\">{{ l.label }}<\u002Fspan>\n              <span style=\"flex:1;height:2.5px;background:#17140f;opacity:.1;border-radius:3px\"><\u002Fspan>\n              <span style=\"font-family:'Archivo Black';font-size:13px\">{{ l.value }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:9px;margin-top:14px\">\n        <button sc-camel-on-click=\"{{ copyRecap }}\" style=\"flex:1;padding:12px;background:#fffdf7;border:3px solid #17140f;border-radius:10px;font-family:'Archivo Black';font-size:12px;letter-spacing:.06em\" style-hover=\"background:#2ea86a\">{{ copyLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ closeRecap }}\" style=\"flex:1;padding:12px;background:#17140f;color:#fffdf7;border:3px solid #17140f;border-radius:10px;font-family:'Archivo Black';font-size:12px;letter-spacing:.06em\">CLOSE<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;bottom:22px;transform:translateX(-50%) skewX(-8deg);z-index:99;padding:12px 24px;background:#17140f;background-image:repeating-linear-gradient(115deg, rgba(255,212,0,.16) 0 8px, transparent 8px 22px);color:#ffd400;border:3px solid #ffd400;border-radius:6px;animation:pop .2s ease;box-shadow:6px 6px 0 rgba(232,64,42,.9)\">\n      <span style=\"display:block;transform:skewX(8deg);font-family:'Archivo Black';font-size:14px;letter-spacing:.12em\">{{ toast }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\nconst ROSTER = [\n  {id:'ember',name:'EMBER',color:'#e8402a'},{id:'volt',name:'VOLT',color:'#ffd400'},\n  {id:'bramble',name:'BRAMBLE',color:'#2ea86a'},{id:'tide',name:'TIDE',color:'#1f6fd0'},\n  {id:'quarry',name:'QUARRY',color:'#8a6a4a'},{id:'moth',name:'MOTH',color:'#9b6ad4'},\n  {id:'cinder',name:'CINDER',color:'#ff7a29'},{id:'pip',name:'PIP',color:'#f06fa8'},\n  {id:'gale',name:'GALE',color:'#4fc3d9'},{id:'rust',name:'RUST',color:'#b4471f'},\n  {id:'koi',name:'KOI',color:'#ff5f7e'},{id:'nova',name:'NOVA',color:'#5b5bd6'},\n  {id:'basalt',name:'BASALT',color:'#4a4a52'},{id:'wren',name:'WREN',color:'#78b843'},\n  {id:'husk',name:'HUSK',color:'#c9a227'},{id:'zephyr',name:'ZEPHYR',color:'#2bbfa0'}\n];\nconst BY_ID = Object.fromEntries(ROSTER.map(r => [r.id, r]));\nlet NAMES = {};\nlet IMAGES = {};\nlet EXTRA = {};\nconst PALETTE = ['#e8402a','#ffd400','#2ea86a','#1f6fd0','#9b6ad4','#ff7a29','#f06fa8','#4fc3d9','#78b843','#5b5bd6','#c9a227','#2bbfa0'];\nfunction fighter(id){ return BY_ID[id] || EXTRA[id] || null; }\nfunction nameOf(id){ return (NAMES[id] || (fighter(id)||{}).name || '—'); }\nfunction colorOf(id){ return (fighter(id)||{}).color || '#17140f'; }\nfunction imgOf(id){ return IMAGES[id] || null; }\nconst KEY = 'stocklog.cooper.v2';\nconst INK = '#17140f';\n\nfunction dayKey(ts){ const d = new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }\nfunction fmtDay(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }\nfunction pct(w,n){ return n ? Math.round(w/n*100)+'%' : '—'; }\nfunction pickRandom(list){ return list[Math.floor(Math.random()*list.length)].id; }\n\nclass Component extends DCLogic {\n  state = {\n    tab:'home', mode:'solo', me:'ember', partner:'gale', opp1:'tide', opp2:'moth',\n    matches:[], stocks:3, pending:null, picker:null, recapOpen:false, names:{}, images:{}, custom:[], pool:{}, spin:null, editId:null, search:'', recent:[], koMe:0, koNathan:0, listening:false, heard:'', players:[], vsPlayer:'', newPlayer:'', renameMode:false,\n    toast:'', saved:'SAVED', copyLabel:'COPY RECAP TEXT', scrubIdx:null, handoffOn:false, loaded:false\n  };\n\n  componentDidMount(){\n    let s = null;\n    try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){}\n    if (s && Array.isArray(s.matches)) this.setState({...s, names:s.names||{}, images:s.images||{}, custom:s.custom||[], pool:s.pool||{}, recent:s.recent||[], players:s.players||[], vsPlayer:s.vsPlayer||'', newPlayer:'', renameMode:false, loaded:true, pending:null, picker:null, recapOpen:false, toast:''});\n    else this.seedFromFile();\n  }\n\n  seed(){\n    const out = []; const now = Date.now(); let id = 1;\n    const days = [6,4,1,0];\n    days.forEach((ago,di) => {\n      const base = now - ago*86400000 - 3*3600000;\n      const n = [7,9,6,5][di];\n      for (let i=0;i<n;i++){\n        const doubles = di===1 && i>3;\n        const win = Math.random() < [0.45,0.62,0.5,0.6][di];\n        out.push({\n          id:id++, ts: base + i*7*60000,\n          result: win?'W':'L', margin: 1+Math.floor(Math.random()*3),\n          mode: doubles?'doubles':'solo',\n          me: ['ember','ember','volt','tide','bramble'][Math.floor(Math.random()*5)],\n          partner: doubles?'gale':null,\n          opp1: ['tide','moth','nova','koi','rust'][Math.floor(Math.random()*5)],\n          opp2: doubles?'husk':null\n        });\n      }\n    });\n    return out;\n  }\n\n  seedFromFile(){\n    this.setState({matches:[], loaded:true});\n    fetch('roster-seed.json', {cache:'no-store'})\n      .then(r => r.ok ? r.json() : null)\n      .then(parsed => {\n        if (!parsed) return;\n        const d = parsed.data || parsed;\n        if (!d || typeof d !== 'object') return;\n        this.persist({\n          matches: Array.isArray(d.matches) ? d.matches : [],\n          names: d.names || {}, images: d.images || {}, custom: d.custom || [],\n          pool: d.pool || {}, players: d.players || [],\n          stocks: d.stocks || 3,\n          me: d.me || this.state.me, partner: d.partner || this.state.partner,\n          opp1: d.opp1 || this.state.opp1, opp2: d.opp2 || this.state.opp2\n        });\n        this.toast('ROSTER LOADED');\n      })\n      .catch(() => {});\n  }\n\n  speechReady(){\n    return typeof window !== 'undefined' && !!(window.SpeechRecognition || window.webkitSpeechRecognition);\n  }\n\n  micBlocked(){\n    try { return window.self !== window.top; } catch(e){ return true; }\n  }\n\n  startVoice(){\n    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;\n    if (!SR) return this.toast('VOICE NOT SUPPORTED HERE');\n    if (this.micBlocked()) return this.toast('OPEN THE REAL SITE TO USE VOICE');\n    if (this._rec) {\n      this._userStopped = true;\n      if (this._stopVoiceWatch) this._stopVoiceWatch();\n      try { this._rec.stop(); } catch(e){}\n      this._rec = null;\n      this.setState({listening:false});\n      this.toast('VOICE OFF');\n      return;\n    }\n    const rec = new SR();\n    rec.lang = 'en-US';\n    rec.interimResults = true;\n    rec.continuous = true;\n    rec.maxAlternatives = 1;\n    this._lastFinal = 0;\n    this._userStopped = false;\n    this._rec = rec;\n    this.setState({listening:true, heard:''});\n    const stopWatch = () => { if (this._voiceTimer){ clearTimeout(this._voiceTimer); this._voiceTimer = null; } };\n    this._stopVoiceWatch = stopWatch;\n    this._voiceTimer = setTimeout(() => {\n      this._voiceTimer = null;\n      if (!this._rec || this._voiceStarted) return;\n      try { this._rec.stop(); } catch(e){}\n      this._rec = null;\n      this.setState({listening:false});\n      this.toast('MIC UNAVAILABLE');\n    }, 6000);\n    this._voiceStarted = false;\n    rec.onstart = () => { this._voiceStarted = true; };\n    rec.onspeechstart = () => { stopWatch(); };\n    rec.onresult = (e) => {\n      stopWatch();\n      let pending = '';\n      for (let i = this._lastFinal; i < e.results.length; i++){\n        const seg = e.results[i][0].transcript;\n        if (e.results[i].isFinal){\n          this._lastFinal = i + 1;\n          const line = seg.trim();\n          if (line) { this.setState({heard: line}); this.applyVoice(line); }\n        } else {\n          pending += seg + ' ';\n        }\n      }\n      if (pending.trim()) this.setState({heard: pending.trim()});\n    };\n    rec.onerror = (e) => {\n      stopWatch();\n      this._rec = null;\n      this.setState({listening:false});\n      this.toast(e.error === 'not-allowed' ? 'MIC PERMISSION DENIED' : 'VOICE ERROR');\n    };\n    rec.onend = () => {\n      stopWatch();\n      if (!this._userStopped && this._voiceStarted){\n        try { rec.start(); return; } catch(e){}\n      }\n      this._rec = null;\n      this.setState({listening:false});\n    };\n    try { rec.start(); } catch(e){ stopWatch(); this._rec = null; this.setState({listening:false}); this.toast('COULD NOT START MIC'); }\n  }\n\n  applyVoice(text){\n    const norm = (v) => (v||'').toLowerCase()\n      .replace(/&/g,' and ')\n      .replace(/[^a-z0-9]/g,'');\n    const loose = (v) => norm(v).replace(/and/g,'').replace(/junior|jr/g,'jr');\n    const roster = ROSTER.concat(this.state.custom || []);\n    const entries = roster.map(r => ({id:r.id, key:norm(nameOf(r.id)), lkey:loose(nameOf(r.id))}))\n      .filter(e => e.key.length > 1);\n    const people = ['me','i','my','myself','im','cooper','nathan','we','us','and','with','using','playing','picked','pick','got','is','was','it']\n      .concat((this.state.players||[]).map(p => norm(p)));\n\n    const lower = ' ' + text.toLowerCase() + ' ';\n    const splitAt = [' vs ', ' versus ', ' against ', ' v '].reduce((best,tok) => {\n      const i = lower.indexOf(tok);\n      return i > -1 && (best.i < 0 || i < best.i) ? {i, len:tok.length} : best;\n    }, {i:-1, len:0});\n    if (splitAt.i < 0) return this.finishVoice(null, 'SAY \"… VS …\"');\n\n    const sides = [lower.slice(1, splitAt.i), lower.slice(splitAt.i + splitAt.len)];\n\n    const scan = (flat, keyOf) => {\n      const hits = [];\n      entries.forEach(e => {\n        const k = keyOf(e);\n        if (!k || k.length < 2) return;\n        let from = 0, at;\n        while ((at = flat.indexOf(k, from)) > -1){ hits.push({id:e.id, at, len:k.length}); from = at + 1; }\n      });\n      hits.sort((a,b) => a.at - b.at || b.len - a.len);\n      const out = [];\n      let cursor = -1;\n      hits.forEach(h => {\n        if (h.at < cursor || out.includes(h.id)) return;\n        out.push(h.id);\n        cursor = h.at + h.len;\n      });\n      return out;\n    };\n    const findIn = (chunk) => {\n      const strict = scan(norm(chunk), e => e.key);\n      if (strict.length) return strict;\n      return scan(loose(chunk), e => e.lkey);\n    };\n\n    const strip = (chunk) => chunk.split(/[^a-z0-9']+/i)\n      .filter(w => w && !people.includes(norm(w))).join(' ');\n    const left = findIn(strip(sides[0]));\n    const right = findIn(strip(sides[1]));\n\n    if (!left.length && !right.length) return this.finishVoice(null, 'NO FIGHTERS MATCHED — CHECK ROSTER NAMES');\n    if (!left.length) return this.finishVoice(\n      right[0] ? (right.length > 1 ? {mode:'doubles', opp1:right[0], opp2:right[1]} : {opp1:right[0]}) : null,\n      'ONLY HEARD THEIR SIDE');\n    if (!right.length) return this.fin de,\n      me: swap ? s.opp1 : s.me,\n      partner: s.mode==='doubles' ? (swap ? s.opp2 : s.partner) : null,\n      opp1: swap ? s.me : s.opp1,\n      opp2: s.mode==='doubles' ? (swap ? s.partner : s.opp2) : null,\n      vs: s.vsPlayer || '',\n      koMe: s.koMe || 0,\n      koNathan: s.koNathan || 0\n    };\n    this.persist({matches:[...s.matches, m], pending:null, scrubIdx:null, koMe:0, koNathan:0});\n    this.toast(m.result==='W' ? 'WIN LOGGED' : 'LOSS LOGGED');\n  }\n\n  charStats(filter){\n    const map = {};\n    (filter||this.state.matches).forEach(m => {\n      const add = (id) => {\n        if(!id) return;\n        map[id] = map[id] || {w:0,l:0,diff:0};\n        if (m.result==='W'){ map[id].w++; map[id].diff += m.margin; } else { map[id].l++; map[id].diff -= m.margin; }\n      };\n      add(m.me); if (m.partner) add(m.partner);\n    });\n    return Object.entries(map).map(([id,v]) => ({id, ...v, n:v.w+v.l, name:nameOf(id), color:colorOf(id)}))\n      .sort((a,b) => b.n - a.n);\n  }\n\n  streaks(){\n    let cur=0, curType=null, bestW=0, bestL=0, runW=0, runL=0;\n    this.state.matches.forEach(m => {\n      if (m.result==='W'){ runW++; runL=0; bestW=Math.max(bestW,runW); } else { runL++; runW=0; bestL=Math.max(bestL,runL); }\n    });\n    for (let i=this.state.matches.length-1;i>=0;i--){\n      const r = this.state.matches[i].result;\n      if (curType===null){ curType=r; cur=1; } else if (r===curType) cur++; else break;\n    }\n    return {cur, curType, bestW, bestL};\n  }\n\n  chip(color, size){\n    const s = size||30;\n    return {flex:'none',width:s+'px',height:s+'px',borderRadius:'8px',background:color,border:'2.5px solid '+INK,\n      display:'flex',alignItems:'center',justifyContent:'center',fontFamily:\"'Archivo Black'\",fontSize:(s*0.42)+'px',\n      color:'#fffdf7',textShadow:'0 1px 0 rgba(23,20,15,.45)',overflow:'hidden'};\n  }\n  chipOf(id, size){\n    const base = this.chip(colorOf(id), size);\n    const src = imgOf(id);\n    return src ? {... if (file) this.handleFile(id, file);\n      }\n    };\n  }\n\n  spinRoll(keys, pool){\n    if (this._spin) clearInterval(this._spin);\n    const rand = () => pool[Math.floor(Math.random()*pool.length)].id;\n    const tick = () => {\n      const s = {};\n      keys.forEach(k => { s[k] = rand(); });\n      this.setState({spin:s});\n    };\n    tick();\n    this._spin = setInterval(tick, 70);\n    setTimeout(() => {\n      clearInterval(this._spin); this._spin = null;\n      const patch = {spin:null};\n      keys.forEach(k => { patch[k] = rand(); });\n      this.persist(patch);\n      this.toast(keys.length > 1 ? 'YOU + NATHAN ROLLED' : 'FIGHTER ROLLED');\n    }, 900);\n  }\n  componentWillUnmount(){\n    if (this._spin) clearInterval(this._spin);\n    if (this._voiceTimer) clearTimeout(this._voiceTimer);\n    if (this._rec){ try { this._rec.stop(); } catch(e){} this._rec = null; }\n  }\n\n  renderVals(){\n    const s = this.state;\n    NAMES = s.names || {};\n    IMAGES = s.images || {};\n    EXTRA = Object.fromEntries((s.custom||[]).map(c => [c.id, c]));\n    const ROSTER_ALL = ROSTER.concat(s.custom || []);\n    const inPool = (id) => (s.pool || {})[id] !== false;\n    const POOL = ROSTER_ALL.filter(r => inPool(r.id));\n    const ROLL = POOL.length ? POOL : ROSTER_ALL;\n    const today = this.todayMatches();\n    const tW = today.filter(m=>m.result==='W').length, tL = today.length - tW;\n    const cW = s.matches.filter(m=>m.result==='W').length, cL = s.matches.length - cW;\n    const st = this.streaks();\n    const diff = today.reduce((a,m)=> a + (m.result==='W'? m.margin : -m.margin), 0);\n    const csFilter = this.charStats(today);\n    const allStats = this.charStats();\n\n    const tabs = ['home','session','roster','random','tiers','stats'].map(t => ({\n      label: t==='home'?'HOME':t==='session'?'SESSION':t==='roster'?'ROSTER':t==='random'?'RANDOM':t==='tiers'?'TIERS':'STATS',\n      style: this.pill(s.tab===t, '#17140f'),\n      go: () => this.persist({tab:t} er',justifyContent:'center',gap:'8px',\n        padding:'11px 15px', background: s.listening ? '#e8402a' : '#ffd400', color: s.listening ? '#fffdf7' : INK,\n        border:'3px solid '+INK, borderRadius:'10px', boxShadow: s.listening ? '2px 2px 0 '+INK : '4px 4px 0 '+INK,\n        transform: s.listening ? 'translate(2px,2px)' : 'none',\n        fontFamily:\"'Archivo Black'\", fontSize:'12px', letterSpacing:'.06em', width:'100%',\n        animation: s.listening ? 'blip 1.4s ease-in-out infinite' : 'none', transition:'all .12s ease'},\n      startVoice: () => this.startVoice(),\n      recentPicks: playedRecent.filter(id => { const q = (s.search||'').trim().toLowerCase(); return !q || nameOf(id).toLowerCase().includes(q); }).map(id => ({\n        name: nameOf(id), initial: this.initialOf(id), chip: this.chipOf(id, 26),\n        style:{display:'flex',alignItems:'center',gap:'7px',padding:'6px 9px',background:'#fffdf7',\n          border:'2.5px solid '+INK, borderRadius:'9px', boxShadow:'2px 2px 0 '+INK,\n          fontFamily:\"'Archivo Black'\", fontSize:'11.5px', letterSpacing:'.02em', whiteSpace:'nowrap'},\n        go: () => this.persist({[s.picker]: id, picker:null, search:'',\n          recent: [id].concat((s.recent||[]).filter(x => x !== id)).slice(0,8)})\n      })),\n      hasRecent: playedRecent.some(id => { const q = (s.search||'').trim().toLowerCase(); return !q || nameOf(id).toLowerCase().includes(q); }),\n      searchValue: s.search,\n      onSearch: (e) => this.setState({search: e.target.value}),\n      clearSearch: () => this.setState({search:''}),\n      hasSearch: !!s.search,\n      searchCount: (() => { const q = (s.search||'').trim().toLowerCase(); if (!q) return ROSTER_ALL.length + ' FIGHTERS'; const n = ROSTER_ALL.filter(r => nameOf(r.id).toLowerCase().includes(q)).length; return n + ' MATCH' + (n===1?'':'ES'); })(),\n      noResults: (() => { const q = (s.search||'').trim().toLowerCase(); return !!q && !ROSTER_ALL.some(r => nameOf(r.id).toLowerCase().includes(q)); })(),\n      pickerOpen: !!s.picker, closePicker: () => this.setState({picker:null, search:''}), stop: (e) => e.stopPropagation(),\n      pickerTitle: s.picker==='me' ? 'PICK YOUR FIGHTER' : s.picker==='partner' ? \"PICK NATHAN'S FIGHTER\" : 'PICK OPPONENT FIGHTER',\n      addFighter: () => {\n        const list = s.custom || [];\n        const id = 'c'+Date.now();\n        const color = PALETTE[(ROSTER.length + list.length) % PALETTE.length];\n        this.persist({custom: [...list, {id, name:'FIGHTER '+(ROSTER.length + list.length + 1), color}]});\n        this.toast('FIGHTER ADDED');\n      },\n      rosterCount: ROSTER_ALL.length,\n      roster: rosterFiltered,\n      rosterAll: rosterStable,\n\n      renameMode: s.renameMode, pickMode: !s.renameMode,\n      renameBtnLabel: s.renameMode ? 'DONE' : '✎ RENAME',\n      renameBtnStyle: {marginLeft:'auto', ...this.pill(s.renameMode, '#1f6fd0'), padding:'7px 11px', fontSize:'11px'},\n      toggleRename: () => this.setState({renameMode: !s.renameMode}),\n      recapOpen: s.recapOpen, openRecap: () => this.setState({recapOpen:true}), closeRecap: () => this.setState({recapOpen:false}),\n      recapDots: today.slice(-16).map(m => ({style:{flex:1,minWidth:'5px',borderRadius:'3px',border:'2px solid '+INK, background: m.result==='W'?'#2ea86a':'#e8402a'}})),\n      recapLines, copyLabel: s.copyLabel,\n      copyRecap: () => {\n        const txt = 'STOCKLOG · '+fmtDay(dayKey(Date.now()))+'\\n'+tW+'–'+tL+' ('+pct(tW,today.length)+') · stock diff '+(diff>0?'+':'')+diff+'\\n'+today.map(m=>m.result).join('');\n        try { navigator.clipboard.writeText(txt); } catch(e){}\n        this.setState({copyLabel:'COPIED ✓'});\n        setTimeout(()=>this.setState({copyLabel:'COPY RECAP TEXT'}), 1600);\n      },\n      exportCsv: () => this.exportCsv()\n    };\n  }\n\n  exportCsv(){\n    const rows = [['date','time','mode','result','margin','me','partner','opp1','opp2']];\n    this.state.matches.forEach(m => rows.push([dayKey(m.ts), new Date(m.ts).toLocaleTimeString(), m.mode, m.result, m.margin,\n      nameOf(m.me), m.partner?nameOf(m.partner):'', nameOf(m.opp1), m.opp2?nameOf(m.opp2):'']));\n    const csv = rows.map(r => r.join(',')).join('\\n');\n    const url = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));\n    const a = document.createElement('a'); a.href = url; a.download = 'stocklog-matches.csv'; a.click();\n    setTimeout(()=>URL.revokeObjectURL(url), 2000);\n    this.toast('CSV EXPORTED');\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
